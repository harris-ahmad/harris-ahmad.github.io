  title: "Paper published at The ACM Web Conference 2024 (WWW '24)"
  body: >-
    Our paper "Uncovering the Hidden Data Costs of Mobile YouTube Video Ads"
    was published at WWW '24 in Singapore — the first independent empirical
    study of mobile YouTube ad data costs from the user perspective.
