- date: "2024-05"
  label: "May 2024"
  title: "YouTube affordability paper accepted at ACM WWW '24"
  body: >-
    Our paper "Uncovering the Hidden Data Costs of Mobile YouTube Video Ads"
    was accepted to the ACM Web Conference 2024 (WWW '24) in Singapore —
    the first independent empirical study of mobile YouTube ad data costs
    from the user perspective.
  links:
    - label: "PDF"
      url: "/files/ytafford-www24.pdf"
    - label: "DOI"
      url: "https://doi.org/10.1145/3589334.3645496"
