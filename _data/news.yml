- date: "2026-08"
  label: "August 2026"
  title: "Released BlastRadius — cross-repo dependency memory for coding agents"
  body: >-
    Released BlastRadius, an MCP server and Claude Code plugin that tells a
    coding agent which other repositories break before it bumps a shared
    Docker image, Terraform module, GitHub Action, Helm chart, or npm package.
  links:
    - label: "Overview"
      url: "/blastradius/"
    - label: "GitHub"
      url: "https://github.com/harris-ahmad/blastradius-mcp"
    - label: "PyPI"
      url: "https://pypi.org/project/blastradius-mcp/"

