{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" aria-label="Toggle menu" aria-expanded="false"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      {% comment %}<!-- main.min.js toggles .hidden on the overflow list; mirror that into aria-expanded -->{% endcomment %}
      <script>
        (function () { var btn = document.querySelector("#site-nav > button"); var list = document.querySelector("#site-nav .hidden-links"); if (!btn || !list || !window.MutationObserver) { return; } new MutationObserver(function () { btn.setAttribute("aria-expanded", list.classList.contains("hidden") ? "false" : "true"); }).observe(list, { attributes: true, attributeFilter: ["class"] }); })();
      </script>
      <button type="button" class="theme-toggle" aria-label="Theme: system. Switch theme" title="Theme: system. Switch theme"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
    </div>
  </div>
</div>
